name: Gandeeva
description: >-
  Gandeeva Therapeutics is a Vancouver, Canada-based precision-medicine and drug-discovery
  company that combines cryogenic electron microscopy (cryo-EM) with artificial intelligence
  and machine learning to visualize druggable transient protein-protein interactions at atomic
  resolution and design first-in-class molecular glues and engineered antibodies. Its
  structure-guided platform spans target prediction and validation (SPOTLIGHT), hit
  identification across virtual and fragment libraries (HYPERFOCUS), and cryo-EM-driven lead
  optimization (CRYO-CADD), with an oncology-focused pipeline of proximity-inducing small
  molecules. The company raised a $40M Series A and has run cryo-EM research collaborations
  with partners including Moderna and Zymeworks. Gandeeva is a private biotechnology company
  and does not publish a public developer API; this profile is maintained in the API Evangelist
  network as a company/portfolio record.
